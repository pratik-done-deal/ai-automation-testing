[pytest]
testpaths = test_cases
addopts = -ra --strict-markers --browser chromium --html=reports/report.html --self-contained-html --alluredir=reports/allure --clean-alluredir
markers =
    buyer: buyer-facing flows (cue card, express interest, document request modal)
    seller: seller-facing flows (interest received, accept modal, upload)
    admin: admin / biz user flows (deal data room, acting on buyer's behalf)
    api: backend contract checks that run without a browser UI
    e2e: full buyer -> seller -> admin journey
    phase1: buyer expresses interest in the seller cue cards and records the deals (no seller login needed)
    phase2: seller / admin side of the phase 1 deals (needs the seller session)
    smoke: fast subset for every deploy
    destructive: creates deals or uploads documents; consumes a fresh company uid
    live_login: completes a real login against the backend: sends one real passcode and creates a device session for that account, which can evict a saved auth/<role>.json (re-save it afterwards)
    not_implemented_yet: covers PRD behaviour not yet built in donedeal-web; expected to fail until shipped
    biz_user: biz user flows (acting on a buyer's or seller's behalf)
    pending_feature(slug): behaviour after feature <slug> ships; strict xfail until specs/features/<slug>/feature.yml says shipped
    slow: waits on a backend scheduler cycle (hot-lead flows: up to DD_HLE_HOT_POLL_SECONDS per check); deselect with -m "not slow"
    superseded_by(slug): behaviour that feature <slug> replaces; runs until <slug> ships, then skipped (kept for history)
