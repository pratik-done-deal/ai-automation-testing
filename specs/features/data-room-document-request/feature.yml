    - src/Container/DealNotesContainer/DealDataRoom/
    - src/Container/DataRoom/dataRoomModel.js
    - src/constants/keyVariableConstants.js
  endpoints:
    - deal/capture/interest
    - deal/capture/interest/update
    - company/cue/card/fetch
    - deal/query
    - deal/seller
    - document/query
    - document/user/upload
    - document/deal/share
